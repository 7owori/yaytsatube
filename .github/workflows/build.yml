name: build
# Собирает установщик на Windows и кладёт его в релиз. Срабатывает сам, когда меняется программа.
on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'requirements.txt', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать exe
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Yaytsatube-Setup --icon assets\icon.ico --add-data "app\ui.html;." --add-data "assets\icon.ico;." --hidden-import pystray._win32 app\eggtube.py
      - name: Проверить, что exe запускается
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process -FilePath dist\Yaytsatube-Setup.exe -ArgumentList '--selftest', $out -Wait -PassThru
          if (-not (Test-Path $out)) { throw "exe не прошёл самопроверку (код $($p.ExitCode))" }
          "VER=$(Get-Content $out)" >> $env:GITHUB_ENV
      - name: Выложить релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VER"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\Yaytsatube-Setup.exe --clobber
          } else {
            gh release create $tag dist\Yaytsatube-Setup.exe --target $env:GITHUB_SHA --title "Яйцатюб $env:VER" --latest --notes "Скачай Yaytsatube-Setup.exe и запусти: программа сама предложит установку. Если Яйцатюб уже стоит, скачивать ничего не нужно: Настройки → «Проверить обновления»."
          }
          # промежуточные версии не копим: остаются первый релиз и текущий
          gh release list --limit 100 --json tagName --jq '.[].tagName' | ForEach-Object { if ($_ -ne $tag -and $_ -ne 'v3.0.0') { gh release delete $_ --yes --cleanup-tag } }
          exit 0
